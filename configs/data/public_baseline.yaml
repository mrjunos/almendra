# @package data
# Public-dataset baseline (Phase 1). Brings up the full pipeline end-to-end
# before proprietary multi-view data is available.
name: public_baseline
root: data                          # dataset root (raw payloads managed by DVC)

# Which data/sources/*.yaml adapters to combine. Detection/segmentation sources
# are cropped to one bean per image by the ingestion pipeline.
# usk_coffee is added once it is downloaded (needs a manual portal download).
sources:
  - roboflow_robusta_defects

image_size: 224
views_per_bean: 1                   # public data is single-view

# Synthesise `model.num_views` views from each single-view bean (distinct fixed
# orientations). A stand-in for real multi-view data — see almendra.datasets.pseudoview.
# Keep false for the single-view baseline; set true for multi-view experiments.
pseudo_views: false

splits:
  train: 0.70
  val: 0.15
  test: 0.15
  stratified: true                  # stratify by canonical class
  group_by: source_image            # keep crops from the same source image in one split

num_workers: 4
