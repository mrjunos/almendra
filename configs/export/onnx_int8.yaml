# @package export
opset: 17
dynamic_batch: true                 # dynamic batch axis for batched inference

quantize:
  enabled: true
  mode: int8_dynamic                # int8_dynamic (Phase 1) | int8_static (Phase 5) | none
  # Dynamic INT8 needs no calibration set and ~4x-shrinks the weights.
  # Static PTQ (better for raw speed) is a Phase 5 task — see docs/research-log.md.

# Numerical parity check: exported model vs the source PyTorch model.
parity:
  enabled: true
  tolerance: 1.0e-3                 # max abs logit difference
  num_samples: 64
