# @package export
opset: 17
dynamic_batch: true                 # dynamic batch axis for batched inference

quantize:
  enabled: true
  mode: int8_static                  # int8_static | int8_dynamic | none
  # Static PTQ quantizes weights AND activations using a real-image calibration
  # set drawn from the train split of the manifest.
  calibration_samples: 100

# Numerical parity check: exported model vs the source PyTorch model.
parity:
  enabled: true
  tolerance: 1.0e-3                 # max abs logit difference
  num_samples: 64
