name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # core + dev + train + export — installs torch/sklearn/onnx so the model,
      # metrics and pipeline modules are exercised. The `data` extra (roboflow,
      # dvc) is omitted: tests do not touch dataset downloads.
      - name: Install (core + dev + train + export)
        run: uv sync --extra dev --extra train --extra export

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
