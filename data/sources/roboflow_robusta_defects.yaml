# Dataset adapter — Robusta Coffee Bean Defects (Roboflow Universe)
name: roboflow_robusta_defects
title: "Robusta Coffee Bean Defects"
url: "https://universe.roboflow.com/coffee-beans-ixp8d/robusta-coffee-bean-defects-hatuw"
provider: roboflow

license: "CC BY 4.0"
commercial_use: true
status: usable

species: robusta
roast: green
capture: controlled
approx_images: 1507                  # v2; ~627 annotated instances across 7 classes
format: instance_segmentation        # polygon/box instances -> crop to one bean each

download:
  method: roboflow
  workspace: coffee-beans-ixp8d
  project: robusta-coffee-bean-defects-hatuw
  version: 2
  format: coco-segmentation
  notes: "Needs a free Roboflow API key in the ROBOFLOW_API_KEY env var."

ingest:
  crop: instances                    # crop each annotated instance to a single-bean image
  task: defect                       # contributes to the defect axis

# Source label -> almendra canonical defect class. See data/taxonomy.yaml.
# Names must match the Roboflow project's class names exactly.
class_map:
  "Good bean": sound
  "Black": full_black
  "Broken": broken_chipped_cut
  "Insect damage": severe_insect_damage
  "Quaker": immature                 # quaker = immature bean (visible after roast)
  "Empty": hull_husk
  "Scorched": defect_unspecified      # mapping reviewed in docs/datasheets/

notes: >
  Primary source of real per-class defect labels for the Phase 1 baseline.
  Robusta, not Arabica — defect morphology is largely shared across species,
  but this is documented as a known domain gap in docs/datasheets/.
