[project]
name = "almendra"
version = "0.0.1"
description = "A fast, re-trainable system for classifying green coffee beans by defect and grade."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "mrjunos" }]
keywords = [
    "coffee",
    "green-coffee",
    "computer-vision",
    "defect-classification",
    "agriculture",
    "edge-ai",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core dependencies — kept torch-free so `almendra info`, taxonomy loading and
# config composition work in a lightweight environment. Heavy ML/runtime deps
# live in optional extras below.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.4",
    "mlflow>=2.12",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",
]
data = [
    "dvc>=3.50",
    "huggingface-hub>=0.23",
    "kagglehub>=0.3",
    "roboflow>=1.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
almendra = "almendra.cli:main"

[project.urls]
Homepage = "https://github.com/mrjunos/almendra"
Repository = "https://github.com/mrjunos/almendra"
Issues = "https://github.com/mrjunos/almendra/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/almendra"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
